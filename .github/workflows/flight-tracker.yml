name: Chris Flight Display

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: chris-flight-display
  cancel-in-progress: false

jobs:
  update-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce 30-minute poster interval
        id: interval
        shell: bash
        run: |
          last=$(git log -1 --format=%ct -- Chris_Flight_Poster.bin)
          now=$(date +%s)
          if [[ -n "$last" ]] && (( now - last < 1800 )); then
            echo "run_tracker=false" >> "$GITHUB_OUTPUT"
            echo "Poster was updated less than 30 minutes ago; skipping."
          else
            echo "run_tracker=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.interval.outputs.run_tracker == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        if: steps.interval.outputs.run_tracker == 'true'
        run: python -m pip install 'Pillow==10.4.0'

      - name: Check aircraft and generate poster
        if: steps.interval.outputs.run_tracker == 'true'
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          POSTER_OUTPUT: Chris_Flight_Poster.png
          GENERATE_DISPLAY_BIN: '1'
          TZ: Australia/Sydney
        run: python Chris_Cloud_Flight_Tracker.py

      - name: Publish only if a poster was generated
        if: steps.interval.outputs.run_tracker == 'true'
        shell: bash
        run: |
          if [[ ! -f Chris_Flight_Poster.bin ]]; then
            echo 'No qualifying aircraft; keeping the existing poster.'
            exit 0
          fi
          if git diff --quiet -- Chris_Flight_Poster.png Chris_Flight_Poster.bin; then
            echo 'Poster files unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Chris_Flight_Poster.png Chris_Flight_Poster.bin
          git commit -m 'Update flight poster'
          git pull --rebase origin main
          git push origin main
